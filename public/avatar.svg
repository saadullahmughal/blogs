<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e8b88a"/>
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="4"/>

  <g clip-path="url(#circle-clip)">
    <!-- Shoulders & Hoodie -->
    <path d="M 30 190 Q 40 135 100 135 Q 160 135 170 190 Z" fill="url(#shirt-grad)"/>
    <!-- Hoodie Collar Accent -->
    <path d="M 75 137 Q 100 155 125 137 Q 100 165 75 137 Z" fill="#334155"/>

    <!-- Neck -->
    <rect x="88" y="112" width="24" height="28" rx="4" fill="#e8b88a"/>

    <!-- Head / Face -->
    <path d="M 68 70 Q 68 122 100 122 Q 132 122 132 70 Q 132 40 100 40 Q 68 40 68 70 Z" fill="url(#skin-grad)"/>

    <!-- Ears -->
    <ellipse cx="66" cy="78" rx="6" ry="10" fill="#e8b88a"/>
    <ellipse cx="134" cy="78" rx="6" ry="10" fill="#e8b88a"/>

    <!-- Hair (Modern young male style) -->
    <path d="M 64 68 Q 66 32 100 30 Q 134 32 136 68 Q 125 45 100 44 Q 75 45 64 68 Z" fill="#1e1b4b"/>
    <path d="M 70 46 Q 90 25 120 32 Q 100 35 85 45 Z" fill="#312e81"/>

    <!-- Eyebrows -->
    <path d="M 76 62 Q 86 58 92 62" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 108 62 Q 114 58 124 62" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="84" cy="70" rx="4" ry="5" fill="#0f172a"/>
    <ellipse cx="116" cy="70" rx="4" ry="5" fill="#0f172a"/>
    <circle cx="85.5" cy="68.5" r="1.5" fill="#ffffff"/>
    <circle cx="117.5" cy="68.5" r="1.5" fill="#ffffff"/>

    <!-- Modern Glasses -->
    <rect x="74" y="63" width="20" height="15" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="106" y="63" width="20" height="15" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="94" y1="69" x2="106" y2="69" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Nose -->
    <path d="M 98 75 Q 100 83 103 83" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Friendly Smile -->
    <path d="M 88 94 Q 100 104 112 94" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Code Symbol on Hoodie -->
    <text x="100" y="175" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">&lt;/&gt;</text>
  </g>
</svg>
